<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Postula: organiza tus candidaturas de empleo, tus contactos y las versiones de tu CV en un solo lugar."
    />
    <title>Postula · Gestor de candidaturas de empleo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="border-b border-brote-900/10 bg-white">
      <div
        class="mx-auto flex max-w-6xl flex-col items-start gap-4 px-4 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-6"
      >
        <a
          href="/"
          class="flex items-center gap-2 rounded-md font-display text-2xl font-extrabold text-brote-900 hover:text-brote-500 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brote-500"
        >
          <span class="size-8 rounded-lg bg-brote-500" aria-hidden="true"></span>
          Postula
        </a>
        <nav aria-label="Principal">
          <ul class="flex flex-wrap items-center gap-x-6 gap-y-3 font-sans text-sm font-medium text-brote-900">
            <li>
              <a
                href="#como-funciona"
                class="rounded-sm underline-offset-4 hover:text-brote-500 hover:underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brote-500"
                >Cómo funciona</a
              >
            </li>
            <li>
              <a
                href="#planes"
                class="rounded-sm underline-offset-4 hover:text-brote-500 hover:underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brote-500"
                >Planes</a
              >
            </li>
            <li>
              <a
                href="#faq"
                class="rounded-sm underline-offset-4 hover:text-brote-500 hover:underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brote-500"
                >Preguntas</a
              >
            </li>
            <li>
              <a
                href="/app/panel.html"
                class="rounded-sm underline-offset-4 hover:text-brote-500 hover:underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brote-500"
                >Entrar</a
              >
            </li>
            <li>
              <a
                href="/app/panel.html"
                class="inline-block rounded-lg bg-brote-500 px-4 py-2 font-semibold text-brote-50 hover:bg-brote-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brote-500"
                >Crear cuenta</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section aria-labelledby="hero-titulo">
        <h1 id="hero-titulo">Todas tus candidaturas, bajo control</h1>
      </section>

      <section id="como-funciona" aria-labelledby="como-funciona-titulo">
        <h2 id="como-funciona-titulo">Cómo funciona</h2>
      </section>

      <section id="funciones" aria-labelledby="funciones-titulo">
        <h2 id="funciones-titulo">Qué puedes hacer</h2>
      </section>

      <section id="planes" aria-labelledby="planes-titulo">
        <h2 id="planes-titulo">Planes</h2>
      </section>

      <section id="faq" aria-labelledby="faq-titulo">
        <h2 id="faq-titulo">Preguntas frecuentes</h2>
      </section>
    </main>

    <footer>
      <section aria-labelledby="newsletter-titulo">
        <h2 id="newsletter-titulo">Newsletter</h2>
      </section>
    </footer>
  </body>
</html>
